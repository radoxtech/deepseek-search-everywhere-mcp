name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Label-triggered e2e runs get their own group so they neither cancel nor get cancelled by PR runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'main' }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test,lint]" build twine

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: Validate server.json
        run: python scripts/validate_server_json.py

      - name: Build
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/deepseek-search-everywhere-mcp" --version
          "$RUNNER_TEMP/smoke/bin/deepseek-search-everywhere-mcp" --help

  docker:
    name: Docker smoke test
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run Docker smoke tests
        run: bash scripts/smoke_docker.sh

  live-tests:
    name: Live LLM tests
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled') || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for API key
        id: key
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEEPSEEK_API_KEY is not available; skipping live tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.key.outputs.present == 'true'
        run: python -m pip install -e ".[test]"

      - name: Run live tests
        if: steps.key.outputs.present == 'true'
        run: pytest -q -m live

      - name: Run live LLM judge tests
        if: steps.key.outputs.present == 'true'
        run: pytest -q -m live_llm

      - name: Upload live test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-llm-report
          path: build/live-report.json
          if-no-files-found: ignore

  live-e2e:
    name: Live end-to-end tests
    # Paid live run: only on manual dispatch or when the `e2e` label is added to a PR (no schedule).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for API key
        id: key
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEEPSEEK_API_KEY is not available; skipping live e2e tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.key.outputs.present == 'true'
        run: python -m pip install -e ".[test]"

      - name: Run live e2e tests
        if: steps.key.outputs.present == 'true'
        run: pytest -q -s -m live_e2e

      - name: Upload live e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-e2e-report
          path: build/live-report.json
          if-no-files-found: ignore
