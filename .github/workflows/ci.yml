name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test,lint]" build twine

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: Validate server.json
        run: python scripts/validate_server_json.py

      - name: Build
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/deepseek-search-everywhere-mcp" --version
          "$RUNNER_TEMP/smoke/bin/deepseek-search-everywhere-mcp" --help

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run Docker smoke tests
        run: bash scripts/smoke_docker.sh

  live-tests:
    name: Live LLM tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Run live LLM judge tests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pytest -q -m live

      - name: Upload live test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-llm-report
          path: build/live-report.json
          if-no-files-found: ignore

