# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
runtime: "container"

build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - deepseekApiKey
    properties:
      deepseekApiKey:
        type: string
        description: "DeepSeek API key (obtain from https://platform.deepseek.com)"
  commandFunction: |-
    (config) => ({
      command: "deepseek-search-everywhere-mcp",
      args: [],
      env: {
        DEEPSEEK_API_KEY: config.deepseekApiKey
      }
    })
  exampleConfig:
    deepseekApiKey: "sk-your-deepseek-api-key"
