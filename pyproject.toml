[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepseek-search-everywhere-mcp"
version = "3.0.0"
description = "MCP server for web search, page fetch to Markdown, structured data extraction and deep research with citations, built on the DeepSeek Search & Fetch API. Works with Claude Code, Claude Desktop, Cursor, Cline, Windsurf, Zed and OpenCode."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "deepseek",
    "deepseek-api",
    "web-search",
    "deep-research",
    "research",
    "web-scraping",
    "web-fetch",
    "structured-data-extraction",
    "citations",
    "claude",
    "claude-code",
    "claude-desktop",
    "cursor",
    "cline",
    "windsurf",
    "opencode",
    "tavily-alternative",
    "perplexity-alternative",
    "firecrawl-alternative",
    "llm-tools",
    "ai-agents",
    "rag",
]
authors = [{ name = "radoxtech" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.26.0,<2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "starlette>=0.27"]
lint = ["ruff>=0.6"]
http = ["starlette>=0.27", "uvicorn>=0.30"]

[project.scripts]
deepseek-search-everywhere-mcp = "deepseek_search_everywhere_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/radoxtech/deepseek-search-everywhere-mcp"
Repository = "https://github.com/radoxtech/deepseek-search-everywhere-mcp"
Changelog = "https://github.com/radoxtech/deepseek-search-everywhere-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/radoxtech/deepseek-search-everywhere-mcp#readme"
Issues = "https://github.com/radoxtech/deepseek-search-everywhere-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_search_everywhere_mcp"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real DeepSeek API",
    "live_llm: live LLM evaluation tests (run 3x)",
    "live_e2e: end-to-end live pipeline tests",
]
addopts = "-m 'not (live or live_llm or live_e2e)'"
