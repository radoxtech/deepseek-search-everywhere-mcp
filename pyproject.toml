[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "deepseek-search-everywhere-mcp"
version = "3.3.0"
description = "MCP server for web search, page fetch to Markdown, structured data extraction and deep research with citations, built on the DeepSeek Search & Fetch API. Works with Claude Code, Claude Desktop, Cursor, Cline, Windsurf, Zed and OpenCode."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "deepseek",
    "deepseek-api",
    "web-search",
    "deep-research",
    "research",
    "web-scraping",
    "web-fetch",
    "structured-data-extraction",
    "citations",
    "claude",
    "claude-code",
    "claude-desktop",
    "cursor",
    "cline",
    "windsurf",
    "opencode",
    "tavily-alternative",
    "perplexity-alternative",
    "firecrawl-alternative",
    "llm-tools",
    "ai-agents",
    "rag",
]
authors = [{ name = "radoxtech" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3.0,<3.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=1.4", "starlette>=1.10", "jsonschema>=4"]
lint = ["ruff>=0.17"]
http = ["starlette>=1.10", "uvicorn>=0.54"]

[project.scripts]
deepseek-search-everywhere-mcp = "deepseek_search_everywhere_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/radoxtech/deepseek-search-everywhere-mcp"
Repository = "https://github.com/radoxtech/deepseek-search-everywhere-mcp"
Changelog = "https://github.com/radoxtech/deepseek-search-everywhere-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/radoxtech/deepseek-search-everywhere-mcp#readme"
Issues = "https://github.com/radoxtech/deepseek-search-everywhere-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_search_everywhere_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/evals",
    "/plans",
    "/.sisyphus",
    "/build",
    "/dist",
    "/scripts/dev",
    "/scripts/local",
    "/scripts/demo_tui.py",
    "/scripts/record_opencode_demo.sh",
    "/GROWTH_PLAN.md",
    "/opencode.json",
    "/uv.lock",
    "/*.mov",
    "/*.mp4",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real DeepSeek API",
    "live_llm: live LLM evaluation tests (LIVE_REPEATS runs, default 1)",
    "live_e2e: end-to-end live pipeline tests",
]
addopts = "-m 'not (live or live_llm or live_e2e)'"
